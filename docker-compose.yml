name: yolov8-local
# docker compose up -d --build: robot UI, API, rosbridge and read-only telemetry.
# --profile hardware starts the real Doosan driver with --force-request-access and can enable servos.
services:
  rosbridge:
    build:
      context: ./rosbridge
      additional_contexts:
        dsr_interfaces: "${DOOSAN_MSGS_CONTEXT:-https://github.com/DoosanRobotics/doosan-robot2.git#dade65d3a99dd8b29d8eca3689a4ead74f228d77:dsr_msgs2}"
    image: yolov8-e0509-rosbridge:humble
    ports:
      - "${ROBOT_BRIDGE_BIND_IP:-127.0.0.1}:${ROBOT_ROSBRIDGE_PORT:-9090}:${ROBOT_ROSBRIDGE_PORT:-9090}"
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ROBOT_BRIDGE_BIND_IP: "0.0.0.0"
      ROBOT_ROSBRIDGE_PORT: "${ROBOT_ROSBRIDGE_PORT:-9090}"
      ROBOT_NAMESPACE: "${ROBOT_NAMESPACE:-dsr01}"
    init: true
    restart: unless-stopped
  joint-monitor:
    image: yolov8-e0509-rosbridge:humble
    pull_policy: never
    depends_on: [rosbridge]
    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ROBOT_IP: "${ROBOT_IP:-110.120.1.63}"
      ROBOT_NAMESPACE: "${ROBOT_NAMESPACE:-dsr01}"
      ROBOT_MODBUS_PORT: "${ROBOT_MODBUS_PORT:-502}"
    command: ["bash", "-c", "source /ros_ws/install/setup.bash && exec python3 /ros_ws/read_joints.py"]
    init: true
    restart: unless-stopped
  robot-web:
    build:
      context: .
      dockerfile: docker/robot-web.Dockerfile
    image: yolov8-robot-web:local
    depends_on: [rosbridge]
    environment:
      ROBOT_BRIDGE_NETWORK: compose
      ROBOT_ACCESS_BACKEND: "${ROBOT_ACCESS_BACKEND:-ros}"
      ROBOT_IP: "${ROBOT_IP:-110.120.1.63}"
      ROBOT_PORT: "${ROBOT_PORT:-12345}"
      ROBOT_NAMESPACE: "${ROBOT_NAMESPACE:-dsr01}"
      ROBOT_ROS_PC_IP: "${ROBOT_ROS_PC_IP-127.0.0.1}"
      ROBOT_ROSBRIDGE_PORT: "${ROBOT_ROSBRIDGE_PORT:-9090}"
      ROBOT_STALE_SECONDS: "${ROBOT_STALE_SECONDS:-3}"
    volumes:
      - ${ROBOT_STATE_STORAGE:-robot-state}:/var/lib/vision/robot
      - robot-api:/run/robot-api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2);
          s.connect('/run/robot-api/http.sock'); s.sendall(b'GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n');
          assert b' 200 ' in s.recv(128)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    init: true
  doosan-driver:
    profiles: ["hardware"]
    platform: linux/amd64
    build:
      context: ./rosbridge
      dockerfile: doosan-driver.Dockerfile
      additional_contexts:
        doosan: "${DOOSAN_DRIVER_CONTEXT:-https://github.com/DoosanRobotics/doosan-robot2.git#1634069af9cf4b9d446f97aeff2bc0f37dfc6f7d}"
        dsr_interfaces: "${DOOSAN_MSGS_CONTEXT:-https://github.com/DoosanRobotics/doosan-robot2.git#dade65d3a99dd8b29d8eca3689a4ead74f228d77:dsr_msgs2}"
        drfl: "${DOOSAN_SDK_CONTEXT:-https://github.com/DoosanRobotics/API-DRFL.git#ddf59fad8bbd71d8aa318bf5f00349913b33f334}"
      args:
        DRCF_MAJOR: "${ROBOT_DRCF_MAJOR:-2}"
    image: yolov8-e0509-driver:humble-gl010117
    depends_on: [rosbridge]
    environment:
      ROBOT_ACCESS_BACKEND: "${ROBOT_ACCESS_BACKEND:-ros}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      ROBOT_IP: "${ROBOT_IP:-110.120.1.63}"
      ROBOT_PORT: "${ROBOT_PORT:-12345}"
      ROBOT_NAMESPACE: "${ROBOT_NAMESPACE:-dsr01}"
    # Apply the access-mode guard even with an already prepared GL010117 image.
    volumes:
      - ./rosbridge/start-driver.sh:/doosan_ws/start-driver.sh:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "source /doosan_ws/install/setup.bash && exec python3 /doosan_ws/driver_health.py"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    init: true
  gateway:
    depends_on:
      robot-web:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    image: yolov8-local-gateway:latest
    env_file:
      - path: ./.env
        required: false
    # stack.sh exports the backend selected on the command line.
    environment:
      - YOLO_BACKEND
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    volumes:
      - robot-api:/run/robot-api:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
volumes:
  robot-api:
  robot-state:
