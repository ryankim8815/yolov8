worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    # Docker Desktop also advertises an AAAA address on IPv4-only bridges.
    resolver 127.0.0.11 ipv6=off valid=30s;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream robot_api { server unix:/run/robot-api/http.sock; }
    server {
        listen 8080;
        server_name _;
        location = /gateway-healthz {
            default_type application/json;
            return 200 '{"status":"ok","role":"gateway"}';
        }
        location = /robot-healthz { proxy_pass http://robot_api/healthz; }
        location = /robot { proxy_pass http://robot_api; }
        location ^~ /api/robot/ { proxy_pass http://robot_api; }
        location ~ ^/static/(robot(-(poses|work-points|gripper|work-plane|camera-frame))?\.(css|js)|station-(nav\.js|icons\.svg|shell\.css)|packing\.css|dashboard-camera\.css|detection-feed\.js|gripper-(orientation|depth|measurement)\.js)$ {
            proxy_pass http://robot_api;
        }
        location = / {
            set $native_host host.docker.internal;
            proxy_pass http://$native_host:8000;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @robot_home;
        }
        location @robot_home { return 302 /robot; }
        location / {
            set $native_host host.docker.internal;
            proxy_pass http://$native_host:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;
            proxy_send_timeout 5s;
            send_timeout 5s;
        }
    }
}
