<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대시보드 · Vision Lab</title>
  <link rel="stylesheet" href="/static/station-shell.css">
  <link rel="stylesheet" href="/static/packing.css">
  <link rel="stylesheet" href="/static/dashboard-camera.css">
  <link rel="stylesheet" href="/static/dashboard-monitor.css">
  <script type="module" src="/static/packing.js"></script>
</head>
<body class="station-shell" data-workspace="demo">
  <aside class="station-rail" id="station-rail"></aside>
  <div id="packing-station">
    <header class="crumb"><span>워크스페이스</span><span aria-hidden="true">/</span><b>패킹 스테이션 01</b></header>
    <main class="content">
      <div class="headline">
        <div><p class="date">예시 주문 · 패킹 시뮬레이션</p><h1 id="page-title">대시보드</h1></div>
        <button type="button" data-action="voice" class="voice" aria-expanded="false" aria-controls="voice-panel">
          <svg class="station-icon" aria-hidden="true"><use href="/static/station-icons.svg#mic"></use></svg>
          음성 명령
        </button>
      </div>
      <section class="voice-panel" id="voice-panel" aria-label="음성 명령" hidden></section>
      <p class="packing-error" id="packing-error" role="alert" hidden></p>
      <div class="view" id="demo-view"></div>
      <div class="announce" id="demo-status" role="status" aria-live="polite"></div>
    </main>
  </div>
  <template id="dashboard-layout">
    <div id="dashboard-monitor">
      <section class="dashboard-workbar" aria-label="모니터링할 이동 프리셋">
        <label>이동 프리셋 <select data-dashboard="preset" disabled><option>목록 조회 중</option></select></label>
        <span class="pill" data-dashboard="mode">가상 경로</span><span data-dashboard="execution" role="status">경로 조회 중</span>
        <a data-dashboard="edit" href="/robot#work-points-title">경로 확인·편집 →</a><button type="button" data-monitor="reload">새로고침</button>
      </section>
      <div class="dashboard-workgrid">
        <section class="panel dashboard-robot" aria-labelledby="dashboard-robot-title">
          <div class="panel-head"><h2 id="dashboard-robot-title">3D 시뮬레이션</h2><span class="meta" data-dashboard="robot-state">로봇 상태 조회 중</span><button type="button" data-monitor="path" aria-pressed="true">경로 표시</button></div>
          <div data-dashboard="arm-view" class="dashboard-arm">
            <div class="dashboard-arm-scene"><canvas data-arm="canvas" aria-label="E0509 6축 로봇의 가상 작업면"></canvas><svg data-arm="labels" aria-hidden="true"></svg><span data-arm="graphics" hidden></span><span class="dashboard-arm-hint">드래그하여 둘러보기 · 표시 전용</span></div>
            <p class="dashboard-model-hint" data-dashboard="model-hint"></p>
            <div data-arm="simulation" hidden><span data-arm="simulationStage"></span><small data-arm="simulationMetrics" hidden></small></div>
            <div class="dashboard-simulation-controls">
              <div class="row"><strong data-dashboard="stage">저장된 경로를 선택하세요.</strong><output data-dashboard="step-count">—</output></div>
              <div class="buttons"><button type="button" data-monitor="play" disabled aria-describedby="dashboard-play-reason">시뮬레이션 시작</button><button type="button" data-monitor="pause" disabled>일시정지</button><button type="button" data-monitor="sim-stop" disabled>가상 재생 종료</button><button type="button" data-monitor="confirm" hidden>가상 파지 확인 후 이송</button><label>배속 <select data-dashboard="rate"><option>1</option><option>5</option><option selected>10</option><option>20</option></select></label></div>
              <p id="dashboard-play-reason" data-dashboard="reason" role="status"></p>
              <div class="dashboard-demo-controls"><label>예시 경로<select data-dashboard="demo-region"><option value="floor">바닥 · 수직 파지</option><option value="shelf">선반 · 수평 파지</option></select></label><button type="button" data-monitor="demo">예시 17단계 가상 재생</button><span class="meta">저장된 프리셋과 별도 · 저장하지 않음</span></div>
              <div class="dashboard-step-controls"><button type="button" data-monitor="previous" disabled aria-label="이전 가상 단계">←</button><input type="range" min="0" max="1000" value="0" data-dashboard="progress" aria-label="가상 경로 진행" disabled><button type="button" data-monitor="next" disabled aria-label="다음 가상 단계">→</button></div>
              <p class="meta" data-dashboard="simulation-context">브라우저 시뮬레이션 · 실제 장비 명령 없음</p>
            </div>
            <details class="dashboard-readings" data-arm="readings"><summary>관절·좌표 <span data-arm="array"></span></summary><div data-arm="joints" class="dashboard-joints" role="group" aria-label="강조할 관절"></div><p class="meta" data-arm="received"></p><h3>모델 플랜지 · BASE 계산값</h3><dl data-arm="flange" class="dashboard-pose"></dl><h3><span data-arm="tcpTitle">실측 TCP</span> <small data-arm="tcpState"></small></h3><dl data-arm="tcp" class="dashboard-pose"></dl><span class="meta" data-arm="source"></span></details>
            <div data-arm="parcelBox" class="dashboard-box-meta" hidden><strong data-arm="boxTitle"></strong><span data-arm="boxSize"></span><span data-arm="boxCenter"></span></div>
            <div data-arm="hand" class="dashboard-hand-meta" hidden><span data-arm="handStatus"></span><span data-arm="handTarget" hidden></span><span data-arm="handPosition" hidden></span><span data-arm="handOpening"></span><span data-arm="handObserved"></span><span data-arm="handNote"></span><button data-arm="handRead" type="button" disabled hidden>상태 읽기</button></div>
          </div>
        </section>
        <div class="dashboard-cameras">
      <section class="panel" id="live-camera">
        <div class="panel-head camera-panel-head"><h2 class="camera-heading"><svg class="station-icon" aria-hidden="true"><use href="/static/station-icons.svg#scan-line"></use></svg>탐지 카메라</h2><a class="work-plane-link" data-pick="planeLink" href="/robot#work-plane" aria-label="캘리브레이션">캘리브레이션</a><span class="camera-state" data-camera="state" role="status">서버 연결 중</span></div>
        <details class="dashboard-camera-settings" open><summary>카메라 입력·표시 설정 · RGB와 Depth 공통 입력</summary><form class="camera-source" data-camera="source">
          <label for="camera-device">입력 카메라</label>
          <select id="camera-device" data-camera="device" disabled><option value="">목록 조회 중…</option></select>
          <button type="submit" data-camera="apply" disabled>적용</button>
          <button type="button" data-camera="refresh" aria-label="카메라 목록 새로고침">새로고침</button>
          <label class="camera-mode">표시 모드
            <select data-camera="mode" disabled aria-describedby="camera-mode-note">
              <option value="detections">탐지 영상</option>
              <option value="color">컬러 원본</option>
              <option value="depth" disabled hidden>깊이 맵</option>
              <option value="infrared" disabled>적외선</option>
              <option value="rgbd" disabled hidden>컬러 + 깊이</option>
              <option value="cloud" disabled hidden>3D 포인트 클라우드</option>
            </select>
          </label>
          <p id="camera-mode-note" data-camera="modeNote" hidden></p>
          <p data-camera="notice" role="status" hidden></p>
        </form></details>
        <figure class="camera">
          <img data-camera="image" alt="활성 모델의 탐지 상자, 클래스 및 신뢰도가 표시된 실시간 카메라 영상" hidden>
          <svg class="class-overlay" data-camera="overlay" aria-hidden="true" hidden>
            <defs>
              <mask id="class-spotlight" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
                <rect width="100%" height="100%" fill="white"></rect>
                <g data-camera="cutouts" fill="black"></g>
              </mask>
            </defs>
            <rect width="100%" height="100%" fill="#13272b" opacity=".42" mask="url(#class-spotlight)"></rect>
            <g data-camera="outlines" fill="none" stroke="#9effce" stroke-width="3"></g>
          </svg>
          <div class="camera-empty" data-camera="empty">
            <p data-camera="message">실시간 영상 연결 중</p>
            <a href="/training#live" data-camera="settings" hidden>카메라 설정 열기</a>
          </div>
          <figcaption class="lens-label" data-camera="caption" hidden></figcaption>
        </figure>
        <section class="class-summary" aria-label="현재 프레임의 탐지 클래스">
          <div class="class-heading"><h3>탐지 클래스</h3><span data-camera="classCount">—</span></div>
          <div class="class-chips" data-camera="chips" role="group" aria-label="강조할 클래스 선택"></div>
          <p class="class-detail" data-camera="detail">탐지 결과 대기 중</p>
        </section>
        <div class="metrics">
          <div><span>탐지 속도</span><strong><b data-camera="fps">—</b> <em>FPS</em></strong></div>
          <div><span>서버 지연 p95</span><strong><b data-camera="latency">—</b> <em>ms</em></strong></div>
          <div><span>탐지 객체</span><strong><b data-camera="count">—</b> <em>개</em></strong></div>
        </div>
      </section>
          <section class="panel dashboard-depth" aria-labelledby="dashboard-depth-title"><div class="panel-head"><h2 id="dashboard-depth-title">Depth 카메라</h2><span data-depth="state" class="meta" role="status">연결 확인 중</span></div><figure class="camera dashboard-depth-image"><img data-depth="image" alt="컬러 좌표에 정렬된 실시간 깊이 영상" hidden><canvas data-depth="last" aria-label="마지막으로 수신한 깊이 영상" hidden></canvas><svg data-depth="marker" aria-hidden="true"></svg><div class="camera-empty" data-depth="empty"><p data-depth="message">Depth 영상을 기다리고 있습니다.</p><a href="/training#live">카메라 설정 →</a></div></figure><div class="dashboard-depth-readout"><div class="dashboard-depth-legend"><span>0 m</span><span aria-hidden="true"></span><span>6 m</span></div><p class="meta">검정: 깊이 없음 · 영상의 지점을 누르면 거리 조회</p><p data-depth="value" role="status">선택한 지점 없음</p><p class="meta" data-depth="frame">프레임 수신 대기</p><p class="meta" data-depth="sync">RGB·Depth 정렬 정보 대기</p></div></section>
        </div>
        <section class="panel dashboard-conversation" aria-labelledby="dashboard-conversation-title"><div class="panel-head"><h2 id="dashboard-conversation-title">음성 대화 내역</h2><span data-conversation="state" class="meta" role="status">연결 확인 중</span></div><div class="dashboard-conversation-mode"><span data-conversation="context">주문·재고 / 로봇 명령</span><button type="button" class="link" data-action="voice">주문·재고 명령</button></div><div data-dashboard="voice-controls"></div><p class="dashboard-conversation-notice" data-conversation="notice" role="status"></p><div data-conversation="log" class="dashboard-chat-log" role="log" aria-label="최종 음성 인식문과 응답" aria-live="polite"><p class="dashboard-chat-empty" data-conversation="empty">음성 대화를 시작하면 최종 인식문과 응답이 시간순으로 표시됩니다.</p></div><div class="dashboard-conversation-footer"><button type="button" data-conversation="latest" hidden>새 대화 · 최신으로</button><span class="meta">서비스별 최근 200개 · 이 장비에 저장</span><span class="meta">실제 로봇 승인·실행은 <a href="/robot#work-points-title">이동 프리셋</a>에서 확인하세요.</span></div></section>
      </div>
    </div>
    <div class="dashboard-lower-grid">
      <section class="panel">
        <div class="panel-head"><h2>현재 주문</h2><button type="button" class="link" data-action="order-detail">상세 ↗</button></div>
        <div class="pad order-pad" id="dashboard-order"></div>
      </section>
      <section class="panel">
      <div class="panel-head"><h2>최근 작업 기록</h2><button type="button" class="link" data-action="all-logs">전체 기록 →</button></div>
      <div id="dashboard-events"></div>
      </section>
    </div>
  </template>
</body>
</html>
