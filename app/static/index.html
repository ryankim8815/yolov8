<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대시보드 · Vision Lab</title>
  <link rel="stylesheet" href="/static/station-shell.css">
  <link rel="stylesheet" href="/static/packing.css">
  <link rel="stylesheet" href="/static/dashboard-camera.css">
  <script type="module" src="/static/packing.js"></script>
</head>
<body class="station-shell" data-workspace="demo">
  <aside class="station-rail" id="station-rail"></aside>
  <div id="packing-station">
    <header class="crumb"><span>워크스페이스</span><span aria-hidden="true">/</span><b>패킹 스테이션 01</b></header>
    <main class="content">
      <div class="headline">
        <div><p class="date">예시 주문 · 패킹 시뮬레이션</p><h1 id="page-title">대시보드</h1></div>
        <button type="button" data-action="voice" class="voice" aria-expanded="false" aria-controls="voice-panel">
          <svg class="station-icon" aria-hidden="true"><use href="/static/station-icons.svg#mic"></use></svg>
          음성 명령
        </button>
      </div>
      <section class="voice-panel" id="voice-panel" aria-label="음성 명령" hidden></section>
      <p class="packing-error" id="packing-error" role="alert" hidden></p>
      <div class="view" id="demo-view"></div>
      <div class="announce" id="demo-status" role="status" aria-live="polite"></div>
    </main>
  </div>
  <template id="dashboard-layout">
    <div class="duo">
      <section class="panel" id="live-camera">
        <div class="panel-head"><h2 class="camera-heading"><svg class="station-icon" aria-hidden="true"><use href="/static/station-icons.svg#scan-line"></use></svg>탐지 카메라</h2><span class="camera-state" data-camera="state" role="status">서버 연결 중</span></div>
        <form class="camera-source" data-camera="source">
          <label for="camera-device">입력 카메라</label>
          <select id="camera-device" data-camera="device" disabled><option value="">목록 조회 중…</option></select>
          <button type="submit" data-camera="apply" disabled>적용</button>
          <button type="button" data-camera="refresh" aria-label="카메라 목록 새로고침">새로고침</button>
          <p data-camera="notice" role="status" hidden></p>
        </form>
        <figure class="camera">
          <img data-camera="image" alt="활성 모델의 탐지 상자, 클래스 및 신뢰도가 표시된 실시간 카메라 영상" hidden>
          <svg class="class-overlay" data-camera="overlay" aria-hidden="true" hidden>
            <defs>
              <mask id="class-spotlight" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
                <rect width="100%" height="100%" fill="white"></rect>
                <g data-camera="cutouts" fill="black"></g>
              </mask>
            </defs>
            <rect width="100%" height="100%" fill="#13272b" opacity=".42" mask="url(#class-spotlight)"></rect>
            <g data-camera="outlines" fill="none" stroke="#9effce" stroke-width="3"></g>
          </svg>
          <div class="camera-empty" data-camera="empty">
            <p data-camera="message">실시간 영상 연결 중</p>
            <a href="/training#live" data-camera="settings" hidden>카메라 설정 열기</a>
          </div>
          <figcaption class="lens-label" data-camera="caption" hidden></figcaption>
        </figure>
        <section class="class-summary" aria-label="현재 프레임의 탐지 클래스">
          <div class="class-heading"><h3>탐지 클래스</h3><span data-camera="classCount">—</span></div>
          <div class="class-chips" data-camera="chips" role="group" aria-label="강조할 클래스 선택"></div>
          <p class="class-detail" data-camera="detail">탐지 결과 대기 중</p>
        </section>
        <div class="metrics">
          <div><span>탐지 속도</span><strong><b data-camera="fps">—</b> <em>FPS</em></strong></div>
          <div><span>서버 지연 p95</span><strong><b data-camera="latency">—</b> <em>ms</em></strong></div>
          <div><span>탐지 객체</span><strong><b data-camera="count">—</b> <em>개</em></strong></div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>현재 주문</h2><button type="button" class="link" data-action="order-detail">상세 ↗</button></div>
        <div class="pad order-pad" id="dashboard-order"></div>
      </section>
    </div>
    <section class="panel">
      <div class="panel-head"><h2>최근 작업 기록</h2><button type="button" class="link" data-action="all-logs">전체 기록 →</button></div>
      <div id="dashboard-events"></div>
    </section>
  </template>
</body>
</html>
